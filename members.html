<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d14"><meta name="description" content="Sign in or create a Tacoma Nights community account."><title>Member Sign In | Tacoma Nights</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./assets/css/site.css"><link rel="stylesheet" href="./assets/css/network.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js" defer></script><script src="./assets/js/config.js" defer></script><script src="./assets/js/site.js" defer></script><script src="./assets/js/network.js" defer></script></head><body><a class="skip" href="#main">Skip to content</a><div id="site-header" data-active="members"></div><main id="main"><section class="pagehero"><div class="wrap"><p class="eyebrow">TACOMA NIGHTS COMMUNITY</p><h1>Welcome to<br><span>the conversation.</span></h1><p>Sign in to your Tacoma Nights account or create one to get started.</p></div></section><section class="section"><div class="wrap" style="max-width:620px"><div class="auth"><div class="tabs"><button type="button" class="active" data-auth-mode="signin">Sign in</button><button type="button" data-auth-mode="signup">Create account</button></div><form id="auth-form"><label for="member-email">Email address</label><input id="member-email" name="email" type="email" autocomplete="email" required><label for="member-password">Password</label><input id="member-password" name="password" type="password" autocomplete="current-password" minlength="6" required><button id="auth-submit" class="btn gold" type="submit">Sign in</button><button id="forgot-password" class="btn outline" type="button">Forgot password?</button><p id="auth-message" class="message" role="status" aria-live="polite"></p></form><div id="member-session" hidden></div></div><p class="muted">Creating an account does not automatically grant crew, contributor or administrator permissions. Those permissions are assigned separately.</p></div></section></main><div id="site-footer"></div></body></html>
