<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Studio | Tacoma Nights</title><link rel="stylesheet" href="../../assets/css/v3.css"><script src="../../assets/js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="../../assets/js/v3.js"></script></head><body data-root="../../"><div id="site-header"></div><main id="main"><section class="page-hero"><div class="wrap"><p class="eyebrow">PRIVATE NETWORK MANAGEMENT</p><h1>Create. Review. Publish.</h1><p class="lede">Manage episodes, articles, events, features and original productions.</p></div></section><section class="page-body"><div class="wrap"><p class="notice" data-control-status role="status">Verifying access…</p><div class="control-shell" data-control-room hidden><nav class="control-nav"><a href="../">Overview</a><a href="../broadcasts/">Broadcast Manager</a><a href="../programming/">Programming</a><a href="../content/">Content Studio</a><a href="../community/">Community Desk</a><a href="../contributors/">Contributors</a><a href="../settings/">Settings</a></nav><div><section data-content-manager><h2>Publish content</h2><form class="form-panel" data-content-create><div class="form-grid"><div class="field"><label>Content type</label><select name="content_type" required><option value="episode">Episode</option><option value="article">Newsroom article</option><option value="event">Community event</option><option value="original">253 Original</option><option value="spotlight">Spotlight</option><option value="perspective">Perspective</option><option value="announcement">Announcement</option></select></div><div class="field"><label>URL slug</label><input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="my-story"></div><div class="field full"><label>Title</label><input name="title" required maxlength="180"></div><div class="field full"><label>Short description</label><textarea name="excerpt" maxlength="500"></textarea></div><div class="field full"><label>Story / episode details</label><textarea name="body" maxlength="20000"></textarea></div><div class="field"><label>Image URL (optional)</label><input name="image_url" type="url"></div><div class="field"><label>Video URL (optional)</label><input name="video_url" type="url"></div><div class="field"><label>Publication status</label><select name="status"><option value="draft">Save draft</option><option value="published">Publish now</option></select></div></div><button class="button red" type="submit">Save content ↗</button><p class="form-status" data-content-status role="status"></p></form><h2>Recent content</h2><div data-content-list class="content-grid"><p class="empty-state">Loading content…</p></div></section></div></div></div></section></main><div id="site-footer"></div></body></html>
