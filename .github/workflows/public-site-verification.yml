name: Tacoma Nights public-site verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/public-navigation-site-verification"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify local public-site links
        run: python3 scripts/verify-public-site.py
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/site.js
          node --check assets/js/network.js
          node --check assets/js/config.js
