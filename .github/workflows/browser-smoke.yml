name: Tacoma Nights Browser Smoke Tests

on:
  workflow_run:
    workflows: ["Deploy Tacoma Nights to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "17 16 * * 1"

permissions:
  contents: read

concurrency:
  group: tacoma-nights-browser-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out test definitions
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run public-site browser tests
        env:
          TACOMA_NIGHTS_BASE_URL: https://crowrulesentertainment-oss.github.io/tacomanights/
        run: npx playwright test
      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tacoma-nights-browser-smoke-report
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
