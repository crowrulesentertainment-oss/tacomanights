      href="assets/css/creators.css">

</head>

<body data-page="live">

<header class="site-header">

<nav class="nav">

<a class="logo" href="index.html">
CROW<span>RULES</span>
</a>

<div class="nav-links">

<a href="live.html">Live</a>
<a href="apply.html">Apply</a>
<a href="dashboard.html">Studio</a>

</div>

</nav>

</header>


<main>

<section class="section">

<div class="container">

<div class="section-heading">

<div>

<div class="eyebrow">
CROWRULES LIVE
</div>

<h1>Live Events</h1>

<p>
Upcoming and currently live creator programming.
</p>

</div>

</div>


<div id="liveEvents"
     class="live-grid">

<div class="loading">
Loading...
</div>

</div>

</div>

</section>


<section class="section">

<div class="container">

<form id="liveForm"
      class="form-card">

<div class="eyebrow">
CREATOR TOOLS
</div>

<h2>Schedule a Live Event</h2>


<div class="form-grid">

<div class="field full">

<label>Title</label>

<input
 name="title"
 required>

</div>


<div class="field full">

<label>Description</label>

<textarea
 name="description"></textarea>

</div>


<div class="field">

<label>Starts</label>

<input
 type="datetime-local"
 name="starts_at"
 required>

</div>


<div class="field">

<label>Ends</label>

<input
 type="datetime-local"
 name="ends_at">

</div>


<div class="field">

<label>YouTube</label>

<input
 type="url"
 name="youtube_url">

</div>


<div class="field">

<label>Twitch</label>

<input
 type="url"
 name="twitch_url">

</div>


<div class="field">

<label>Kick</label>

<input
 type="url"
 name="kick_url">

</div>


<div class="field">

<label>Stream URL</label>

<input
 type="url"
 name="stream_url">

</div>

</div>

<br>

<button class="btn">
Schedule Event
</button>

</form>

</div>

</section>

</main>
