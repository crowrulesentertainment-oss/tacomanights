<main class="main">

<div class="page-header">

<div>
<div class="eyebrow">PUBLISHING</div>
<h1>UPLOAD CENTER</h1>
<p>Prepare your next CrowRules release.</p>
</div>

</div>

<form class="panel form" onsubmit="handleUpload(event)">

<label>
Content Type

<select>
<option>Video</option>
<option>Audio</option>
<option>Podcast Episode</option>
<option>Show Episode</option>
<option>Short</option>
</select>

</label>

<label>
Title
<input required>
</label>

<label>
Description
<textarea rows="6"></textarea>
</label>

<label>
Media File

<input
type="file"
accept="video/*,audio/*"
required
>

</label>

<label>
Thumbnail

<input
type="file"
accept="image/*"
>

</label>

<label>
Category

<select>
<option>Entertainment</option>
<option>Sports</option>
<option>Gaming</option>
<option>Music</option>
<option>Podcast</option>
<option>News</option>
<option>Community</option>
</select>

</label>

<label>
Visibility

<select>
<option>Public</option>
<option>Members Only</option>
<option>Private</option>
</select>

</label>

<div class="hero-actions">

<button type="button" class="btn secondary">
Save Draft
</button>

<button class="btn primary">
Publish Content
</button>

</div>

</form>

</main>
