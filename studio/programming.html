<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Programming | Tacoma Nights Studio</title><link rel="stylesheet" href="../assets/css/site.css"><link rel="stylesheet" href="studio.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js" defer></script><script src="../assets/js/config.js" defer></script><script src="studio-auth.js" defer></script><script src="studio-data.js" defer></script></head><body><main class="studio-main"><p class="eyebrow"><a href="./">← MASTER CONTROL</a> / PROGRAMMING</p><div class="auth-bar"><span id="auth-state">Checking account…</span><form id="studio-login"><input id="studio-email" type="email" placeholder="Email" required><input id="studio-password" type="password" placeholder="Password" required><button class="primary-action">Sign in</button></form><button id="studio-signout" hidden>Sign out</button></div><p id="auth-message" role="status"></p><div id="data-error" class="error-text"></div><h1>Programming <span>Control</span></h1><p class="lede">Manage programs and scheduled broadcast windows. Times are entered in your local timezone and stored as UTC.</p><section class="studio-panel"><h2>Create a program</h2><form id="program-form" class="data-form"><label>Title<input id="program-title" required maxlength="120"></label><label>Slug<input id="program-slug" placeholder="auto from title"></label><label>Category<select id="program-category"><option value="conversation">Conversation</option><option value="community">Community</option><option value="sports">Sports</option><option value="entertainment">Entertainment</option><option value="news">News</option><option value="special">Special</option></select></label><label>Format<select id="program-format"><option value="prerecorded">Prerecorded</option><option value="live">Live</option><option value="standby">Standby</option><option value="gaming">Gaming</option><option value="special">Special</option></select></label><label>Default duration (minutes)<input id="program-duration" type="number" min="5" max="1440" value="60" required></label><label class="wide">Description<textarea id="program-description" rows="2"></textarea></label><button class="primary-action">Save program</button><span id="program-message" role="status"></span></form></section><section class="studio-panel"><h2>Programs</h2><div id="program-list" class="data-list">Sign in to load programs.</div></section><section class="studio-panel"><h2>Schedule a program</h2><form id="schedule-form" class="data-form"><label>Program<select id="schedule-program" required></select></label><label>Host name<input id="schedule-host"></label><label>Start<input id="schedule-start" type="datetime-local" required></label><label>End<input id="schedule-end" type="datetime-local" required></label><label>Handoff<select id="handoff-mode"><option value="producer_approved">Producer approved</option><option value="manual">Manual</option></select></label><label class="wide">Notes<textarea id="schedule-notes" rows="2"></textarea></label><button class="primary-action">Add to schedule</button><span id="schedule-message" role="status"></span></form></section><section class="studio-panel"><h2>Schedule</h2><div id="schedule-list" class="data-list"></div></section></main></body></html>
