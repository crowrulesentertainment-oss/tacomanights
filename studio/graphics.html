<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Network Graphics | Tacoma Nights Studio</title>
<link rel="stylesheet" href="../assets/css/site.css">
<link rel="stylesheet" href="studio.css">
<link rel="stylesheet" href="graphics-control.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js?v=20261123" defer></script>
<script src="../assets/js/config.js?v=20261123" defer></script>
<script src="studio-auth.js?v=20261123" defer></script>
<script src="workflow.js?v=20261123" defer></script>
<script src="graphics-control.js?v=20261123 defer></script>
</head>
<body>
<main class="studio-main graphics-main">
<p class="eyebrow">PRODUCTION / VISUALS / STUDIO 2.0</p>
<h1>On-Air <span>Graphics</span></h1>
<p class="lede">Live network graphics for OBS Studio and Streamlabs Desktop. Each browser source reads the published Tacoma Nights Network state and refreshes automatically.</p>
<div class="auth-bar">
<span id="auth-state">Checking account…</span>
<form id="studio-login">
<input id="studio-email" type="email" autocomplete="username" placeholder="Email" required>
<input id="studio-password" type="password" autocomplete="current-password" placeholder="Password" required>
<button class="primary-action" type="submit">Sign in</button>
</form>
<button id="studio-signout" type="button" hidden>Sign out</button>
</div>
<p id="auth-message" role="status" aria-live="polite"></p>
<section class="studio-panel">
<div class="graphics-title">
<div><small>LIVE DATA SOURCE</small><h2>Network graphics status</h2></div>
<span id="graphics-state" class="graphics-state">CHECKING</span>
</div>
<p id="graphics-detail">Graphics read the existing published public-state record. No new database table or public write permission is required.</p>
<div class="graphics-preview">
<iframe id="graphics-preview" title="On-air graphics preview" src="../network/overlay.html?mode=lower-third"></iframe>
</div>
<div class="graphics-toolbar">
<label>Preview style
<select id="graphics-mode">
<option value="lower-third">Now Playing · Lower Third</option>
<option value="next">Next Up</option>
<option value="schedule">Network Schedule Strip</option>
<option value="full">Full-Screen Program Slate</option>
</select>
</label>
<button id="graphics-refresh" type="button">Refresh preview</button>
</div>
</section>
<section class="graphics-grid">
<article class="studio-panel">
<small>01 / NOW PLAYING</small><h2>Program lower third</h2>
<p>Program title, host, show description and live indicator.</p>
<code id="url-lower"></code>
<button type="button" data-copy="url-lower">Copy OBS / Streamlabs URL</button>
</article>
<article class="studio-panel">
<small>02 / NEXT UP</small><h2>Upcoming program card</h2>
<p>Upcoming show and its scheduled Pacific start time.</p>
<code id="url-next"></code>
<button type="button" data-copy="url-next">Copy OBS / Streamlabs URL</button>
</article>
<article class="studio-panel">
<small>03 / NETWORK SCHEDULE</small><h2>Schedule ticker</h2>
<p>Current program and next scheduled program across the bottom of the screen.</p>
<code id="url-schedule"></code>
<button type="button" data-copy="url-schedule">Copy OBS / Streamlabs URL</button>
</article>
<article class="studio-panel">
<small>04 / FULL SCREEN</small><h2>Program slate</h2>
<p>Full-screen network identity, current show and next program for standby or transitions.</p>
<code id="url-full"></code>
<button type="button" data-copy="url-full">Copy OBS / Streamlabs URL</button>
</article>
</section>
<section class="studio-panel">
<h2>Install in OBS Studio or Streamlabs Desktop</h2>
<ol class="setup-list">
<li>Choose the graphics style above and copy its browser-source URL.</li>
<li>In OBS or Streamlabs, add a <strong>Browser Source</strong> to the scene.</li>
<li>Paste the URL and set width to <strong>1920</strong> and height to <strong>1080</strong>.</li>
<li>Enable shutdown source when not visible only if you are comfortable with the overlay refreshing when shown again.</li>
<li>Place the graphics source above the camera or video source in the scene.</li>
<li>Use source visibility to show or hide the graphic. This never stops or restarts the YouTube livestream.</li>
</ol>
<p class="warning-note">The browser source is read-only. It displays only information already published to the public network state. Keep private production notes and guest contact details out of that record.</p>
<div class="row-actions">
<a href="../network/schedule.html" target="_blank" rel="noopener">View public program guide ↗</a>
<a href="../network/overlay.html?mode=full" target="_blank" rel="noopener">Open full-screen slate ↗</a>
</div>
</section>
</main>
</body>
</html>
