<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Sign In | Tacoma Nights</title><link rel="stylesheet" href="../assets/css/site.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/supabase.js"></script><script src="../assets/js/auth.js"></script><script src="../assets/js/site.js" defer></script></head><body><header class="site-header"><div class="wrap nav"><a class="brand" href="../index.html">TACOMA NIGHTS<small>MEMBER COMMUNITY</small></a><button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button><nav class="nav-links" aria-label="Main navigation"></nav></div></header><main class="content"><div class="wrap"><form id="login" class="panel form-card"><span class="eyebrow">Member access</span><h1>Welcome back.</h1><p class="muted">Watching public episodes does not require an account. Sign in to access your member space.</p><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="button" type="submit">Sign in</button><p class="status" id="status" role="status"></p><p class="muted">Member self-registration is not enabled in this initial release. You can submit a community idea without an account.</p></form></div></main><script>document.getElementById("login").onsubmit=async e=>{e.preventDefault();const s=document.getElementById("status");const {error}=await TNAuth.signIn(email.value,password.value);if(error){s.textContent=error.message;return;}location.href="dashboard.html";};</script></body></html>
