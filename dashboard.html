<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Creator Dashboard · CrowRules</title>

<link rel="stylesheet"
      href="assets/css/creators.css">

</head>

<body data-page="dashboard">

<header class="site-header">

<nav class="nav">

<a class="logo" href="index.html">
CROW<span>RULES</span>
</a>

<div class="nav-links">

<a href="dashboard.html">Dashboard</a>
<a href="studio.html">Studio</a>
<a href="live.html">Live</a>
<a href="analytics.html">Analytics</a>

</div>

<div class="nav-actions">

<button class="btn"
        data-signout>
Sign Out
</button>

</div>

</nav>

</header>


<main class="dashboard">

<div class="container">

<div class="dashboard-header">

<div>

<div class="eyebrow">
CREATOR STUDIO
</div>

<h1 id="dashboardName">
Loading...
</h1>

<p id="dashboardHandle"
   class="handle">
</p>

</div>

<a class="btn"
   href="studio.html">
Create Content
</a>

</div>


<div id="dashboardMessage"></div>


<div class="stats">

<div class="stat-card">

<div class="label">
Content
</div>

<div class="number"
     id="metricContent">
0
</div>

</div>


<div class="stat-card">

<div class="label">
Followers
</div>

<div class="number"
     id="metricFollowers">
0
</div>

</div>


<div class="stat-card">

<div class="label">
Live Events
</div>

<div class="number"
     id="metricLive">
0
</div>

</div>

</div>


<section class="section">

<div class="section-heading">

<div>

<div class="eyebrow">
LIBRARY
</div>

<h2>Your Content</h2>

</div>

</div>


<div class="table-wrap">

<table>

<thead>

<tr>

<th>Title</th>
<th>Type</th>
<th>Status</th>
<th>Views</th>
<th>Created</th>

</tr>

</thead>

<tbody id="dashboardContent">

</tbody>

</table>

</div>

</section>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/config.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/creators.js"></script>

</body>
</html>
