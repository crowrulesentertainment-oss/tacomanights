<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>Sign In · CrowRules Creators</title>

<link rel="stylesheet"
      href="assets/css/creators.css">

</head>

<body>

<header class="site-header">

<nav class="nav">

<a class="logo" href="index.html">
CROW<span>RULES</span>
</a>

</nav>

</header>


<main>

<section class="section">

<div class="container">

<div class="form-card">

<div class="eyebrow">
CREATOR ACCOUNT
</div>

<h1>Sign In</h1>

<form id="loginForm">

<div class="field">

<label>Email</label>

<input
  type="email"
  name="email"
  required
  autocomplete="email">

</div>

<br>

<div class="field">

<label>Password</label>

<input
  type="password"
  name="password"
  required
  autocomplete="current-password">

</div>

<br>

<button class="btn"
        type="submit">
Sign In
</button>

</form>

<hr style="border-color:var(--line);margin:30px 0">

<p style="color:var(--muted)">
Don't have an account?
<a href="apply.html"
   style="color:var(--cyan)">
Apply to become a creator.
</a>
</p>

</div>

</div>

</section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="assets/js/config.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/creators.js"></script>

</body>
</html>
