<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tacoma Nights Staff Access</title><link rel="stylesheet" href="../assets/css/site.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/supabase.js"></script><script src="../assets/js/auth.js"></script></head><body><header class="site-header"><div class="wrap nav"><a class="brand" href="../index.html">TACOMA NIGHTS<small>PRODUCTION OPERATIONS</small></a><a class="text-link" href="../index.html">Public website</a></div></header><main class="content"><div class="wrap"><form id="login" class="panel form-card"><span class="eyebrow">Restricted staff access</span><h1>Command Center</h1><p class="muted">Use an existing CrowRules account authorized for Tacoma Nights administration.</p><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="button" type="submit">Sign in to Command Center</button><p class="status" id="status" role="status"></p></form></div></main><script>document.getElementById("login").onsubmit=async e=>{e.preventDefault();const s=document.getElementById("status");const {data,error}=await TNAuth.signIn(email.value,password.value);if(error){s.textContent=error.message;return;}if(!TNAuth.isAdmin(data.user)){await TNAuth.signOut();s.textContent="This account does not have the required admin role.";return;}location.href="command-center.html";};</script></body></html>
