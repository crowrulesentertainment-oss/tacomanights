<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace | Tacoma Nights</title><link rel="stylesheet" href="../assets/css/site.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/supabase.js"></script><script src="../assets/js/auth.js"></script></head><body><header class="site-header"><div class="wrap nav"><a class="brand" href="../index.html">TACOMA NIGHTS<small>COMMAND CENTER</small></a><a class="text-link" href="command-center.html">← Command Center</a></div></header><main class="content"><div class="wrap"><span class="eyebrow">Admin workspace</span><h1 id="title">Workspace</h1><p class="muted">Read-only record view using existing Tacoma Nights tables.</p><div class="notice">This first deployment is intentionally read-only. Editing actions will be added after each workflow's existing RLS policy and data contract are verified.</div><div class="table-wrap"><table class="data-table"><thead id="head"></thead><tbody id="rows"><tr><td>Loading…</td></tr></tbody></table></div><p class="status" id="status"></p></div></main><script>
const p=new URLSearchParams(location.search),table=p.get("table"),name=p.get("name")||"Workspace";
const allowed=["tacoma_nights_live_sessions","tacoma_nights_production_tasks","tacoma_nights_episode_plans","tacoma_nights_production_episodes","tacoma_nights_production_calendar","tacoma_nights_host_assignments","tacoma_nights_episode_assets","tacoma_nights_public_stories","tacoma_nights_clip_uploads","tacoma_nights_guest_prospects","tacoma_nights_host_applications","tacoma_nights_remote_hosts","tacoma_nights_crew","tacoma_nights_submissions","tacoma_nights_topic_polls","tacoma_nights_community_events","tacoma_nights_featured_video","tacoma_nights_show_settings","tacoma_nights_analytics_events","tacoma_nights_newsletter_subscribers","tacoma_nights_site_settings","tacoma_nights_host_messages","tacoma_nights_page_analytics"];
(async()=>{const {data,error}=await TNAuth.current();if(error||!data.user||!TNAuth.isAdmin(data.user)){location.href="index.html";return;}document.getElementById("title").textContent=name;if(!allowed.includes(table)||table==="—"){document.getElementById("rows").textContent="This workspace is planned but its data connection is not enabled.";return;}const {data:rows,error:err}=await tnSupabase.from(table).select("*").limit(50);const body=document.getElementById("rows"),head=document.getElementById("head");body.replaceChildren();if(err){const tr=document.createElement("tr"),td=document.createElement("td");td.textContent="Query denied by the existing database policy or unavailable: "+err.message;tr.append(td);body.append(tr);return;}if(!rows.length){const tr=document.createElement("tr"),td=document.createElement("td");td.textContent="No records found.";tr.append(td);body.append(tr);return;}const keys=Object.keys(rows[0]).filter(k=>!["internal_notes","private_notes","email","contact_email","message"].includes(k)).slice(0,7);const hr=document.createElement("tr");keys.forEach(k=>{const th=document.createElement("th");th.textContent=k;hr.append(th);});head.append(hr);rows.forEach(row=>{const tr=document.createElement("tr");keys.forEach(k=>{const td=document.createElement("td");td.textContent=String(row[k]??"").slice(0,180);tr.append(td);});body.append(tr);});})();
